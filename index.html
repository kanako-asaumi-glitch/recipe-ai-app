<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品商品開発ナレッジ＆レシピAIシステム</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }
        .tab-active {
            border-bottom: 3px solid #2563eb;
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 初期データ定義 ---
        const INITIAL_RECIPES = [
            {
                id: 1,
                title: "直巻和風ツナおにぎり",
                category: "おにぎり",
                season: "通年",
                ingredients: ["和風ツナ", "だしご飯", "海苔", "醤油", "マヨネーズ"],
                allergens: ["小麦", "卵", "大豆", "ゼラチン", "ツナ(まぐろ)"],
                steps: [
                    "だしご飯（出汁・醤油ブレンド）を一定温度（20〜25℃）に調整。",
                    "和風ツナマヨネーズ和え具材を中心に充填（具材量 約12g）。",
                    "三角成型機にて成型（全重量 約105g）。",
                    "直巻用フィルム海苔にて包装。"
                ],
                notes: "ツナの油脂分が出汁ご飯の結着を弱めないようpH・離水管理に注意。"
            },
            {
                id: 2,
                title: "赤飯おむすび（わびすけ油入り）",
                category: "おにぎり",
                season: "春・秋",
                ingredients: ["もち米", "小豆", "塩", "植物油脂", "わびすけ油"],
                allergens: ["ごま"],
                steps: [
                    "もち米と小豆煮汁を仕込み蒸し上げ。",
                    "ほぐれ性向上および日持ち維持のため「わびすけ油」を規定量添加。",
                    "一定重量に分割成型後、黒ごま塩を表面に振塩。"
                ],
                notes: "もち米の硬化抑制と離型性を高めるため、油成分の均一分散が必須。"
            },
            {
                id: 3,
                title: "もち麦入りごま野沢菜おむすび",
                category: "おにぎり",
                season: "春・夏",
                ingredients: ["もち麦ご飯", "野沢菜漬け", "白ごま", "塩むすび用飯真冷"],
                allergens: ["ごま", "大豆"],
                steps: [
                    "もち麦（炊飯品）と白飯をブレンド（真冷急速冷却）。",
                    "刻み野沢菜の水分を適度に切り、白ごまと共に均一混合。",
                    "丸型成型後、静菌剤ブレンドを分散散布して密封包装。"
                ],
                notes: "野沢菜の水分・pH変動による日持ち低下に留意。酢酸Na併用推奨。"
            },
            {
                id: 4,
                title: "もち麦入りとり五目おむすび（CGC）",
                category: "おにぎり",
                season: "秋・冬",
                ingredients: ["もち麦ご飯", "鶏肉", "ごぼう", "人参", "椎茸", "出汁調味料"],
                allergens: ["小麦", "鶏肉", "大豆", "ごま"],
                steps: [
                    "五目具材（鶏肉・ごぼう等）を甘辛く炊き上げ汁切り。",
                    "真冷ご飯に煮汁と具材を混ぜ込み。",
                    "おむすび状に成型し、チルド帯へ急速冷却。"
                ],
                notes: "具材由来の菌数に注意。煮加熱時の中心温度85℃1分以上を確認。"
            },
            {
                id: 5,
                title: "スーパー大麦入り紅鮭わかめご飯",
                category: "弁当",
                season: "通年",
                ingredients: ["スーパー大麦", "白飯", "紅鮭フレーク", "乾燥わかめ", "塩"],
                allergens: ["さけ", "ごま"],
                steps: [
                    "スーパー大麦を先行炊飯後、白米と混合仕込み。",
                    "ほぐした紅鮭フレークとわかめを均一に混ぜ込み。",
                    "容器詰め、または成型機投入。"
                ],
                notes: "ヘルシー志向商品。大麦のぷちぷち感を損なわない水分保持設計。"
            }
        ];

        const INITIAL_ADDITIVES = [
            {
                id: 1,
                name: "酢酸ナトリウム (酢酸Na)",
                category: "日持ち向上剤 / pH調整剤",
                purpose: "静菌作用（特に耐熱性芽胞菌や一般的な細菌の増殖抑制）、pHの微低下による保存性向上。",
                usageLimit: "一括表示名：pH調整剤 または 調味料（有機酸）。添加量目安：米飯重量に対して0.2%〜0.5%。",
                foodExamples: [
                    { food: "米飯・おにぎり", dosage: "0.2% - 0.4%", note: "若干の酸味が残る場合があるため、味付け（塩分・出汁）で調整。" },
                    { food: "惣菜（和え物）", dosage: "0.3% - 0.5%", note: "ドレッシングやタレの味になじみやすい。" }
                ],
                caution: "添加量が多すぎるとツンとした酢酸臭や特有の酸味が残り、風味が落ちる。グリシンやグリセリン脂肪酸エステル等と併用して抑制。"
            },
            {
                id: 2,
                name: "グリシン",
                category: "日持ち向上剤 / 調味料",
                purpose: "静菌作用の補強、他の日持ち向上剤（酢酸Na等）との相乗効果による日持ち延長、わずかな甘味付与。",
                usageLimit: "一括表示名：調味料（アミノ酸等） または 炊飯ミスト等。添加量目安：0.3%〜1.0%。",
                foodExamples: [
                    { food: "炊飯米・酢飯", dosage: "0.3% - 0.6%", note: "お米の甘みを阻害しない度合いで調整。" },
                    { food: "加工肉・惣菜", dosage: "0.5% - 1.0%", note: "旨味・甘味の補強効果も兼ねる。" }
                ],
                caution: "過剰添加は後味に特有の甘ったるさや渋みを生じさせる。アレルゲン対象外で使いやすい。"
            },
            {
                id: 3,
                name: "しらこたん白（白子蛋白 extraction）",
                category: "保存料（天然物）/ 日持ち向上剤",
                purpose: "サケなどの白子由来の塩基性蛋白質。広範囲の細菌（グラム陽性菌・陰性菌）に対して強力な抗菌効果。",
                usageLimit: "一括表示名：しらこたん白 または 保存料（しらこたん白）。添加量目安：0.1%〜0.3%。",
                foodExamples: [
                    { food: "和惣菜・たれ", dosage: "0.1% - 0.2%", note: "少量で高い静菌力を発揮。" },
                    { food: "おにぎり具材", dosage: "0.15% - 0.3%", note: "マヨネーズ・ツナ等への練り込みに有効。" }
                ],
                caution: "アレルギー表示として「さけ」の特定原材料に準ずるもの等の配慮が必要（製品規格による）。苦味に影響する場合あり。"
            },
            {
                id: 4,
                name: "ショ糖脂肪酸エステル / グリセリン脂肪酸エステル",
                category: "乳化剤 / 品質保持剤",
                purpose: "でんぷんの老化（パサつき・硬化）防止、油分の均一分散、離型性向上。",
                usageLimit: "一括表示名：乳化剤。添加量目安：対米0.1%〜0.3%。",
                foodExamples: [
                    { food: "赤飯・おこわ", dosage: "0.1% - 0.25%", note: "もち米のモチモチ感を持続させる。" },
                    { food: "直巻おにぎり", dosage: "0.1%", note: "機械適性（ほぐれ・成型性）を高める。" }
                ],
                caution: "過剰添加により起泡性が生じる場合や、風味がマスキングされる場合がある。"
            }
        ];

        // --- メインコンポーネント ---
        function App() {
            // パスワード認証状態
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [authError, setAuthError] = useState(false);

            // アプリケーション状態
            const [activeTab, setActiveTab] = useState("recipes"); // 'recipes' | 'additives' | 'ai'
            
            // レシピ・添加物データ
            const [recipes, setRecipes] = useState(INITIAL_RECIPES);
            const [additives, setAdditives] = useState(INITIAL_ADDITIVES);

            // タブ1：フィルター状態
            const [recipeSearch, setRecipeSearch] = useState("");
            const [selectedSeason, setSelectedSeason] = useState("すべて");
            const [selectedCategory, setSelectedCategory] = useState("すべて");

            // タブ2：添加物検索状態
            const [additiveSearch, setAdditiveSearch] = useState("");

            // タブ3：AI提案状態
            const [apiKey, setApiKey] = useState("");
            const [trendWord, setTrendWord] = useState("");
            const [targetCategory, setTargetCategory] = useState("おにぎり");
            const [selectedBaseRecipeId, setSelectedBaseRecipeId] = useState(1);
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiOutput, setAiOutput] = useState(null);
            const [aiError, setAiError] = useState("");

            // アイコン初期化
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, isAuthenticated, aiOutput]);

            // パスワード認証ハンドラ
            const handleLogin = (e) => {
                e.preventDefault();
                // 簡易パスワード: "food2026" または "1234"
                if (passwordInput === "food2026" || passwordInput === "1234" || passwordInput === "admin") {
                    setIsAuthenticated(true);
                    setAuthError(false);
                } else {
                    setAuthError(true);
                }
            };

            // レシピフィルター処理
            const filteredRecipes = useMemo(() => {
                return recipes.filter(r => {
                    const matchSearch = r.title.includes(recipeSearch) || 
                                        r.ingredients.some(i => i.includes(recipeSearch)) ||
                                        r.allergens.some(a => a.includes(recipeSearch));
                    const matchSeason = selectedSeason === "すべて" || r.season.includes(selectedSeason) || r.season === "通年";
                    const matchCategory = selectedCategory === "すべて" || r.category === selectedCategory;
                    return matchSearch && matchSeason && matchCategory;
                });
            }, [recipes, recipeSearch, selectedSeason, selectedCategory]);

            // 添加物フィルター処理
            const filteredAdditives = useMemo(() => {
                return additives.filter(a => {
                    return a.name.includes(additiveSearch) ||
                           a.category.includes(additiveSearch) ||
                           a.purpose.includes(additiveSearch);
                });
            }, [additives, additiveSearch]);

            // Gemini API呼び出し処理
            const generateAiRecipe = async () => {
                if (!trendWord.trim()) {
                    setAiError("トレンドキーワードを入力してください（例：韓流、Z世代、ヘルシー等）");
                    return;
                }

                setIsGenerating(true);
                setAiError("");
                setAiOutput(null);

                const baseRecipe = recipes.find(r => r.id === Number(selectedBaseRecipeId)) || recipes[0];
                
                // プロンプト作成
                const promptText = `
あなたは大手食品メーカーの新商品開発チーフディレクター兼食品科学者です。
以下の【自社ベースレシピ】と【添加物・日持ち向上ナレッジ】を踏まえ、指定された【トレンドキーワード】を取り入れたヒット確定の新商品レシピ案を作成してください。

【トレンドキーワード】: ${trendWord}
【ターゲット形態】: ${targetCategory}
【ベースにする自社レシピ】:
- 商品名: ${baseRecipe.title}
- 使用具材: ${baseRecipe.ingredients.join(', ')}
- 製造注意点: ${baseRecipe.notes}

【利用可能な添加物・品質保持知見】:
- 酢酸ナトリウム（静菌・pH調整）
- グリシン（静菌補強・甘味）
- しらこたん白（天然保存料）
- 乳化剤（でんぷん老化防止・ほぐれ性向上）

以下のJSONフォーマットのみを出力してください（余計な解説文やバックティック記号は含めないでください）。

{
  "productName": "開発する新商品名",
  "concept": "商品コンセプト（トレンドとの掛け合わせ理由）",
  "targetAudience": "想定ターゲット層",
  "ingredients": ["材料1 (〇g)", "材料2 (〇g)", "添加物A (〇%)"],
  "preservationStrategy": "日持ち・品質保持設計（添加物・pH・水分の観点）",
  "manufacturingSteps": [
    "工程1",
    "工程2",
    "工程3"
  ],
  "allergenWarning": "想定されるアレルゲン（表示対象）",
  "costEffectiveness": "製造コスト・作業性に関するワンポイントアドバイス"
}
`;

                try {
                    let resultText = "";

                    if (apiKey.trim()) {
                        // ユーザーがAPIキーを入力している場合：実際のGemini APIにリクエスト
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: promptText }] }]
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`APIエラー: ${response.status} - APIキーまたはリクエストを確認してください。`);
                        }

                        const data = await response.json();
                        resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        // クリーニング (JSON文字列抽出)
                        resultText = resultText.replace(/```json/g, "").replace(/```/g, "").trim();
                    } else {
                        // APIキーが未入力の場合：高品質なダミーレスポンス（模擬生成）
                        await new Promise(resolve => setTimeout(resolve, 1500)); // 擬似遅延
                        
                        resultText = JSON.stringify({
                            productName: `${trendWord}風 ${baseRecipe.title.replace('おにぎり', '')}の極みパック`,
                            concept: `人気の「${trendWord}」要素と自社定番の「${baseRecipe.title}」を融合。映え意識と満足感を両立した商品。`,
                            targetAudience: "Z世代・20〜30代の働く女性・トレンド感度の高い購買層",
                            ingredients: [
                                ...baseRecipe.ingredients.map(i => `${i} (ベース割合)`),
                                `${trendWord}特製スパイス/タレ (5g)`,
                                "酢酸ナトリウム (0.3% - 静菌)",
                                "グリシン (0.4% - 風味保持)"
                            ],
                            preservationStrategy: "酢酸ナトリウム0.3%とグリシン0.4%を併用し、pH5.8〜6.0に調整することで20℃・48時間の日持ちを確保。タレの油分によるでんぷん老化防止効果を促進。",
                            manufacturingSteps: [
                                `1. ${baseRecipe.ingredients[0] || 'ご飯'}に${trendWord}特製風味油とグリシン調味液を均一ブレンド。`,
                                "2. 具材の中心に高粘度のタレを注液充填し、自動成型機にて圧力制御成型。",
                                "3. 表面に静菌用ミストを微量散布し、急速冷却後にフィルム包装。"
                            ],
                            allergenWarning: "小麦, 大豆, 鶏肉, ごま",
                            costEffectiveness: "既存の成型ラインをそのまま流用可能。具材タレの粘度調整のみで歩留まり98%以上を維持見込み。"
                        });
                    }

                    const parsedJson = JSON.parse(resultText);
                    setAiOutput(parsedJson);

                } catch (err) {
                    console.error(err);
                    setAiError(err.message || "レシピ生成中にエラーが発生しました。");
                } finally {
                    setIsGenerating(false);
                }
            };

            // ログイン画面
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200">
                            <div className="text-center mb-6">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-3">
                                    <i data-lucide="utensils" className="w-8 h-8"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800">食品商品開発ナレッジ</h1>
                                <p className="text-sm text-slate-500 mt-1">社内限定レシピ＆品質管理データベース</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">社内アクセスパスワード</label>
                                    <input 
                                        type="password" 
                                        value={passwordInput}
                                        onChange={(e) => setPasswordInput(e.target.value)}
                                        placeholder="パスワードを入力 (例: food2026)" 
                                        className="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                                    />
                                </div>

                                {authError && (
                                    <div className="p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg flex items-center gap-2">
                                        <i data-lucide="alert-circle" className="w-4 h-4 flex-shrink-0"></i>
                                        パスワードが正しくありません。(試用: food2026)
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="lock" className="w-4 h-4"></i>
                                    ログインして閲覧
                                </button>
                            </form>
                            <div className="mt-6 text-center text-xs text-slate-400">
                                簡易デモ用パスワード: <code className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-600 font-mono">food2026</code>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col">
                    {/* ヘッダー */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-blue-600 text-white rounded-lg">
                                        <i data-lucide="chef-hat" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-lg text-slate-900 leading-tight">商品開発ナレッジ＆レシピAI</h1>
                                        <p className="text-xs text-slate-500">自社データベース ＆ 添加物QA ＆ トレンド創出</p>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                        社内ネットワーク接続中
                                    </span>
                                    <button 
                                        onClick={() => setIsAuthenticated(false)}
                                        className="text-xs text-slate-500 hover:text-slate-700 flex items-center gap-1"
                                    >
                                        <i data-lucide="log-out" className="w-4 h-4"></i>
                                        ログアウト
                                    </button>
                                </div>
                            </div>

                            {/* タブナビゲーション */}
                            <div className="flex space-x-8 border-t border-slate-100 pt-1">
                                <button
                                    onClick={() => setActiveTab("recipes")}
                                    className={`py-3 px-1 text-sm font-medium flex items-center gap-2 border-b-2 transition ${
                                        activeTab === "recipes" ? "tab-active border-blue-600" : "border-transparent text-slate-500 hover:text-slate-700"
                                    }`}
                                >
                                    <i data-lucide="database" className="w-4 h-4"></i>
                                    ① レシピストックDB
                                </button>
                                <button
                                    onClick={() => setActiveTab("additives")}
                                    className={`py-3 px-1 text-sm font-medium flex items-center gap-2 border-b-2 transition ${
                                        activeTab === "additives" ? "tab-active border-blue-600" : "border-transparent text-slate-500 hover:text-slate-700"
                                    }`}
                                >
                                    <i data-lucide="flask-conical" className="w-4 h-4"></i>
